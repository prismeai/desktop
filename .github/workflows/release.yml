name: Release

# Build signed installers + a signed updater feed (latest.json) for macOS &
# Windows, and attach them to a GitHub Release. Triggered by pushing a v* tag.
#
# The draft release is created ONCE by the `create-release` job; the per-platform
# `build` jobs then upload into it via `releaseId`. This avoids the race where two
# matrix jobs each try to create the same release (one wins, the other errors).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Releases need write on `contents`. The default GITHUB_TOKEN carries it unless an
# org policy restricts it; set a fine-grained PAT as RELEASE_TOKEN (Contents:
# write) to keep releases working regardless of that policy. It falls back to the
# default token when the secret is absent.
env:
  RELEASE_GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - name: Create the draft release (once)
        id: create
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Prisme.ai Desktop ${tag}`,
              draft: true,
              prerelease: false,
            })
            return String(data.id)

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # Notarization uses an App Store Connect API key (.p8) — more robust in CI
      # than an Apple ID + app-specific password (no 2FA prompts). Stored as a
      # base64 secret, written to a temp file, exposed via APPLE_API_KEY_PATH.
      - name: Prepare Apple notarization key (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
            echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"
          fi

      - name: Build and attach installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ env.RELEASE_GH_TOKEN }}
          # Updater signing — REQUIRED to emit a signed latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID signing (imported into a temp keychain by the action).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # macOS notarization via App Store Connect API key.
          # APPLE_API_KEY_PATH is exported by the step above.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # Windows signing: recommended = Azure Trusted Signing (cloud, CI-friendly,
          # no hardware token). Wire via bundle.windows.signCommand + AZURE_* secrets
          # when the certificate is set up. Until then the .msi/.exe ships unsigned.
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # The bundle filenames carry the version (e.g. Prisme.ai_0.1.2_universal.dmg),
      # so `releases/latest/download/<name>` can't be a stable link. Attach a copy
      # under a fixed name so the docs can offer a one-click "Download" that always
      # resolves to the newest release.
      - name: Add stable-named download alias (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ env.RELEASE_GH_TOKEN }}
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1)
          cp "$dmg" "$RUNNER_TEMP/Prisme.ai-macOS.dmg"
          gh release upload "${{ github.ref_name }}" "$RUNNER_TEMP/Prisme.ai-macOS.dmg" --clobber --repo "${{ github.repository }}"

      - name: Add stable-named download alias (Windows)
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ env.RELEASE_GH_TOKEN }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "$env:RUNNER_TEMP/Prisme.ai-Windows-setup.exe"
          gh release upload "${{ github.ref_name }}" "$env:RUNNER_TEMP/Prisme.ai-Windows-setup.exe" --clobber --repo "${{ github.repository }}"
