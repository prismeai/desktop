[package]
name = "prismeai-desktop"
version = "0.1.5"
description = "Prisme.ai desktop application"
authors = ["Prisme.ai"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique so it doesn't conflict with the
# bin name (an issue on Windows — see rust-lang/cargo#8519).
name = "prismeai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native confirmation dialog (e.g. before changing server).
tauri-plugin-dialog = "2"
# Custom URL scheme (prisme://…) for deep links.
tauri-plugin-deep-link = "2"
# Route a second launch (deep link) to the already-running instance.
# `deep-link`: on Windows/Linux the OAuth callback (ai.prisme.app://…) launches a
# second instance; this forwards its URL to the running app's deep-link handler.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Self-update the shell from a signed release feed (latest.json).
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native OIDC (Authorization Code + PKCE) sign-in via the system browser.
# Trust the OS certificate store (corporate TLS inspection, internal PKI) on top
# of the bundled Mozilla roots, and honour the OS proxy settings.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
    "rustls-tls-webpki-roots",
    "system-proxy",
] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
open = "5"
tokio = { version = "1", features = ["sync", "time"] }
urlencoding = "2"

# macOS: ASWebAuthenticationSession (native auth sheet, auto-close, ephemeral).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.5.2"
objc2-foundation = { version = "=0.2.2", features = ["NSString", "NSURL", "NSError"] }
block2 = "=0.5.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
