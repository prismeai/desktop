[package]
name = "prismeai-desktop"
version = "0.1.0"
description = "Prisme.ai desktop shell (Tauri POC)"
authors = ["Prisme.ai"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique so it doesn't conflict with the
# bin name (an issue on Windows — see rust-lang/cargo#8519).
name = "prismeai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native "open/save file" dialogs. The read/write themselves go through our own
# std::fs commands, so we don't need the fs plugin's path-scope wiring.
tauri-plugin-dialog = "2"
# Native OS notifications (used by the Notification shim injected into the
# remote app window — WKWebView has no web Notification API).
tauri-plugin-notification = "2"
# Custom URL scheme (prisme://…) for deep links.
tauri-plugin-deep-link = "2"
# Route a second launch (deep link) to the already-running instance.
tauri-plugin-single-instance = "2"
# Self-update the shell from a signed release feed (latest.json).
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
