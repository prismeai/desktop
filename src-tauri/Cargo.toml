[package]
name = "prismeai-desktop"
version = "0.1.0"
description = "Prisme.ai desktop shell (Tauri POC)"
authors = ["Prisme.ai"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique so it doesn't conflict with the
# bin name (an issue on Windows — see rust-lang/cargo#8519).
name = "prismeai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native "open/save file" dialogs, callable from the frontend. The read/write
# themselves go through our own Rust commands (below) using std::fs, so we don't
# need the fs plugin's path-scope wiring for this POC.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
