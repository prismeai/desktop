<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect to Prisme.ai</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <main class="card-wrap">
      <div class="card">
        <div class="brand">
          <span class="brand-mark"></span>
          Prisme.ai
        </div>

        <!-- Loading: shown while we resolve the startup state (reachability). -->
        <p id="loading" class="subtitle">Connecting…</p>

        <!-- Connect: enter the server and sign in. -->
        <div id="connect" hidden>
          <h1 class="title">Connect to your server</h1>
          <p class="subtitle">
            Enter your Prisme.ai API URL, e.g.
            <code>https://api.your-company.com</code>.
          </p>

          <form id="connect-form" novalidate>
            <label class="label" for="server-url">Server API URL</label>
            <input
              class="input"
              id="server-url"
              type="text"
              inputmode="url"
              autocomplete="url"
              placeholder="https://api.your-company.com"
              spellcheck="false"
              autofocus
            />
            <p id="error" class="error" role="alert" hidden></p>
            <p id="hint" class="hint" hidden>
              Finish signing in in the window that just opened.
            </p>
            <button class="btn" id="connect-btn" type="submit">Connect</button>
          </form>
        </div>

        <!-- Offline: the stored server is unreachable. -->
        <div id="offline" hidden>
          <h1 class="title">Can't reach your server</h1>
          <p class="subtitle" id="offline-text">
            We couldn't reach your Prisme.ai server. Check your connection and
            try again.
          </p>
          <button class="btn" id="retry-btn" type="button">Retry</button>
        </div>
      </div>
    </main>
  </body>
</html>
